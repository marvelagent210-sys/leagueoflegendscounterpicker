name: Fleet recovery checkpoints

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/codex/fleet-footwork-recovery-compute-20261118'
    name: recovery ${{ matrix.kind }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: sim, shard: 0 }
          - { kind: builds, shard: 0 }
          - { kind: builds, shard: 1 }
          - { kind: builds, shard: 2 }
          - { kind: builds, shard: 3 }
          - { kind: builds, shard: 4 }
          - { kind: builds, shard: 5 }
    env:
      KIND: ${{ matrix.kind }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Compute the paired recovery checkpoints
        id: compute
        run: |
          npx --no-install tsx .github/fleet-recovery-checkpoints.mts "$KIND" "$SHARD"
      - name: Package recovery checkpoints, including on failure
        if: ${{ always() && steps.compute.outcome != 'skipped' }}
        run: |
          tar -czf "recovery-$KIND-$SHARD.tgz" ".cache/$KIND"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.compute.outcome != 'skipped' }}
        with:
          name: recovery-${{ matrix.kind }}-${{ matrix.shard }}
          path: recovery-${{ matrix.kind }}-${{ matrix.shard }}.tgz
          if-no-files-found: error
          retention-days: 7
